<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriCalc Pro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="logo">
                💪
            </div>

            <h1>NutriCalc Pro</h1>

            <p class="subtitle">
                Calcule suas necessidades nutricionais
            </p>

            <form id="formulario">

                <div class="campo">
                    <label for="peso">Peso</label>
                    <input
                        type="number"
                        id="peso"
                        placeholder="Ex.: 70"
                        min="1"
                        step="0.1"
                        required
                    >
                    <span>kg</span>
                </div>

                <div class="campo">
                    <label for="altura">Altura</label>
                    <input
                        type="number"
                        id="altura"
                        placeholder="Ex.: 175"
                        min="1"
                        required
                    >
                    <span>cm</span>
                </div>

                <div class="campo">
                    <label for="idade">Idade</label>
                    <input
                        type="number"
                        id="idade"
                        placeholder="Ex.: 18"
                        min="1"
                        required
                    >
                    <span>anos</span>
                </div>

                <div class="campo">
                    <label for="sexo">Sexo</label>

                    <select id="sexo" required>
                        <option value="">Selecione</option>
                        <option value="masculino">Masculino</option>
                        <option value="feminino">Feminino</option>
                    </select>
                </div>

                <div class="objetivo">

                    <label>Objetivo</label>

                    <div class="objetivos">

                        <label class="opcao">
                            <input
                                type="radio"
                                name="objetivo"
                                value="ganho"
                                required
                            >
                            <span>💪</span>
                            <strong>Ganho de massa</strong>
                        </label>

                        <label class="opcao">
                            <input
                                type="radio"
                                name="objetivo"
                                value="perda"
                            >
                            <span>🔥</span>
                            <strong>Perda de massa</strong>
                        </label>

                    </div>

                </div>

                <button type="submit">
                    CALCULAR RESULTADOS
                </button>

            </form>

        </section>


        <section id="resultados" class="resultado escondido">

            <h2>📊 Seus resultados</h2>

            <p class="descricao">
                Estes são os valores estimados com base nos dados informados.
            </p>

            <div class="cards">

                <div class="resultado-card">
                    <span>🔥</span>
                    <p>Calorias</p>
                    <strong id="calorias">0</strong>
                    <small>kcal/dia</small>
                </div>

                <div class="resultado-card">
                    <span>🥩</span>
                    <p>Proteínas</p>
                    <strong id="proteinas">0</strong>
                    <small>g/dia</small>
                </div>

                <div class="resultado-card">
                    <span>🍚</span>
                    <p>Carboidratos</p>
                    <strong id="carboidratos">0</strong>
                    <small>g/dia</small>
                </div>

                <div class="resultado-card">
                    <span>🥑</span>
                    <p>Gorduras</p>
                    <strong id="gorduras">0</strong>
                    <small>g/dia</small>
                </div>

                <div class="resultado-card">
                    <span>💧</span>
                    <p>Água</p>
                    <strong id="agua">0</strong>
                    <small>litros/dia</small>
                </div>

                <div class="resultado-card">
                    <span>⚖️</span>
                    <p>IMC</p>
                    <strong id="imc">0</strong>
                    <small id="classificacao">-</small>
                </div>

            </div>

            <button id="novoCalculo" class="botao-secundario">
                🔄 Novo cálculo
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
